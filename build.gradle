plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven {
		name 'Xander Maven'
		url 'https://maven.isxander.dev/releases'
	}
	maven { url "https://registry.somethingcatchy.net/repository/maven-public/" }
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/releases/" }
	maven {
		url "https://dl.cloudsmith.io/public/klikli-dev/mods/maven/"
		content {
			includeGroup "com.klikli_dev"
		}
	}
}

loom {
	accessWidenerPath = file("src/main/resources/melius_farming.classtweaker")

	splitEnvironmentSourceSets()

	mods {
		"melius_farming" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"
	modImplementation "maven.modrinth:fabric-seasons:2.4.2-BETA+1.21"

	modCompileOnly "maven.modrinth:jade:${project.jade_version}"
	modRuntimeOnly "maven.modrinth:jade:${project.jade_version}"

	modRuntimeOnly "net.mehvahdjukaar:codecui-fabric:1.21.1-1.4.7"
	modRuntimeOnly "maven.modrinth:moonlight:${project.moonlight_version}"

	modCompileOnly "maven.modrinth:supplementaries:${project.supplementaries_version}"
	modRuntimeOnly "maven.modrinth:supplementaries:${project.supplementaries_version}"

	modRuntimeOnly("maven.modrinth:architectury-api:${project.architectury_api_version}")
	modImplementation ("com.klikli_dev:modonomicon-${minecraft_version}-fabric:${modonomicon_version}"){
		exclude group: 'mezz.jei', module: "jei-${minecraft_version}-common-api"
		exclude group: 'mezz.jei', module: "jei-${minecraft_version}-fabric-api"
		exclude group: 'mezz.jei', module: "jei-${minecraft_version}-fabric"
	}
	modRuntimeOnly("maven.modrinth:geckolib:4.9.3")
	modRuntimeOnly("me.shedaniel.cloth:cloth-config-fabric:15.0.140")
	modCompileOnly("maven.modrinth:lets-do-farm-charm:${project.lets_do_farm_version}")
	modRuntimeOnly("maven.modrinth:lets-do-farm-charm:${project.lets_do_farm_version}")
	modCompileOnly("maven.modrinth:lets-do-brewery-farmcharm-compat:${project.lets_do_brewery_compat_version}")
	modRuntimeOnly("maven.modrinth:lets-do-brewery-farmcharm-compat:${project.lets_do_brewery_compat_version}")
	modCompileOnly("maven.modrinth:lets-do-herbalbrews:43g8sVYA")
	modRuntimeOnly("maven.modrinth:lets-do-herbalbrews:43g8sVYA")
	modCompileOnly("maven.modrinth:icys-better-horses:IPJEtiHQ")
	modRuntimeOnly("maven.modrinth:icys-better-horses:IPJEtiHQ")

	modRuntimeOnly "maven.modrinth:fabric-seasons-extras:1.3.3-BETA+1.21"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
